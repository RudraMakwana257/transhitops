services:
  - type: web
    name: transitops-backend
    runtime: docker
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_DEFAULT
        value: 100/minute
      - key: REDIS_URL
        fromService:
          type: redis
          name: transitops-redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: local

  - type: redis
    name: transitops-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
