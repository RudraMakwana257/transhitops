version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: transitops-db
    environment:
      POSTGRES_USER: transitops_user
      POSTGRES_PASSWORD: transit123
      POSTGRES_DB: transitops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitops_user -d transitops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: transitops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: